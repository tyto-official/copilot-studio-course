name: publish-tberg-du-containers

on:
  push:
    branches:
      - main
    paths:
      - services/t-berg-du/**
      - .github/workflows/publish-tberg-du-containers.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: tberg-du-containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: tberg-du-api
            dockerfile: services/t-berg-du/Dockerfile.api
            title: T-Berg D&U API och MCP
            cache_scope: tberg-du-api
          - image: tberg-du-web
            dockerfile: services/t-berg-du/Dockerfile.web
            title: T-Berg D&U webb
            cache_scope: tberg-du-web

    steps:
      - name: Checka ut repot
        uses: actions/checkout@v7

      - name: Förbered Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Logga in i GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bygg och publicera
        uses: docker/build-push-action@v7
        with:
          context: services/t-berg-du
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/tyto-official/${{ matrix.image }}:latest
            ghcr.io/tyto-official/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.title }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

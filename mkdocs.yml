site_name: Microsoft AI-utbildningar
site_description: Praktiska utbildningar i Microsoft Copilot Studio – från grundläggande agentbygge till den nya instruktionsdrivna upplevelsen.
site_url: https://tyto-official.github.io/copilot-studio-course/

exclude_docs: |
  copilot-studio/standard/11-set-up-for-production.md
  downloads/nextgen/showroom-pafyllning-v1/SKILL.md
  downloads/nextgen/showroom-pafyllning-v2/SKILL.md
  *.en.md

hooks:
  - scripts/mkdocs_hooks.py

theme:
  name: material
  custom_dir: overrides
  language: sv
  features:
    - navigation.top
    - navigation.sections
    - content.code.copy
  palette:
    scheme: default
    primary: custom
    accent: custom

plugins:
  - i18n:
      docs_structure: suffix
      languages:
        - locale: sv
          default: true
          name: Svenska
          build: true

nav:
  - Start: index.md
  - Copilot Studio:
    - Standardagenten:
      - Kursöversikt: copilot-studio/standard/index.md
      - 0. Begrepp och teori: copilot-studio/standard/00-concepts.md
      - 1. Förbered SharePoint: copilot-studio/standard/01-prepare-sharepoint.md
      - 2. Hitta rätt i Copilot Studio: copilot-studio/standard/02-tour-interface.md
      - 3. Skapa en lösning: copilot-studio/standard/03-create-solution.md
      - 4. Skapa agenten: copilot-studio/standard/04-create-agent.md
      - 5. Lägg till kunskap: copilot-studio/standard/05-add-knowledge.md
      - 6. Skapa ett ämne: copilot-studio/standard/06-create-topic.md
      - 7. Skapa ett adaptivt kort: copilot-studio/standard/07-adaptive-card.md
      - 8. Skapa ett flöde: copilot-studio/standard/08-create-flow.md
      - 9. Autonomi: copilot-studio/standard/09-autonomy.md
      - 10. Multi-agent: copilot-studio/standard/10-multi-agent.md
    - Avancerad standardagent:
      - Kursöversikt: copilot-studio/standard-advanced/index.md
      - 0. Kursuppsättning: copilot-studio/standard-advanced/00-course-setup.md
    - Instruktionsdriven agent:
      - Kursöversikt: copilot-studio/nextgen/index.md
      - 0. Kursuppsättning: copilot-studio/nextgen/00-course-setup.md
      - 1. Hitta rätt i nya Copilot Studio: copilot-studio/nextgen/01-navigate-new-experience.md
      - 2. Skapa lösningen: copilot-studio/nextgen/02-create-solution.md
      - 3. Skapa agenten: copilot-studio/nextgen/03-create-agent.md
      - 4. Lägg till produktkunskap: copilot-studio/nextgen/04-add-knowledge.md
      - 5. Skapa den första skillen: copilot-studio/nextgen/05-add-first-skill.md
      - 6. Anslut Centrallager som verktyg: copilot-studio/nextgen/06-add-sharepoint-tool.md
  - Tips & fördjupning:
    - Översikt: tips/index.md
    - Kunskap på djupet: tips/knowledge.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - md_in_html
